name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # tsdown needs a newer Node than the SDK supports, so build once on 24 and test the built package on every supported Node
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA (S-46): a moved tag can never change what runs here
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx publint
      - run: npx @arethetypeswrong/cli --pack .
      # zero runtime dependencies and zero `node:` in the build (§5.1)
      - run: test "$(node -p "Object.keys(require('./package.json').dependencies ?? {}).length")" = 0
      - run: "! grep -rq \"from 'node:\" dist"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - run: npm run typecheck
      # the built package from the build job, never rebuilt here (the build tool does not run on Node 20)
      - run: npm run test:built
      - run: npx vitest run test/redteam
