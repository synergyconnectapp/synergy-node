name: Release

# A tag v*.*.* releases the package to the registry with provenance. Nothing releases before the contract test (K2) and
# the MCP (M1) are green (devtools.md §5.8, U2): the first tag, v1.0.0, is the P1 step.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm Trusted Publisher + provenance
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx publint
      - run: npx @arethetypeswrong/cli --pack .
      - run: npm publish --provenance --access public
